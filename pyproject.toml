[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fennec-cli"
version = "1.8.1"
description = "Thin launcher for the Fennec suite and the Colibri engine CLI (serve/convert/plan/doctor/chat)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
coli = "fennec_cli:main"
fennec = "fennec_cli:main"

[tool.setuptools]
packages = ["fennec_cli"]