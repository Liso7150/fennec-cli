[package]
name = "fennec-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Fennec CLI: runnable form of the Rust port (glue, measured and served over NDJSON). Lives in fennec-cli; core crates come from fennec-core."

[[bin]]
name = "fennec-rs"
path = "src/main.rs"

[dependencies]
serde_json = "1"
fennec-acp = { path = "../../fennec-core/rust/fennec-acp" }
fennec-economy = { path = "../../fennec-core/rust/fennec-economy" }
fennec-outlets = { path = "../../fennec-core/rust/fennec-outlets" }
fennec-preflight = { path = "../../fennec-core/rust/fennec-preflight" }
fennec-pyjson = { path = "../../fennec-core/rust/fennec-pyjson" }