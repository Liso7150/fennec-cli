name: CLI (Rust)

# The CLI lives in fennec-cli; its core crates are path deps on fennec-core, so
# check out both repos side by side. Runs on a SAC-free runner.
on:
  push:
    paths: ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/cli.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: fennec-cli }
      - uses: actions/checkout@v4
        with: { repository: Liso7150/fennec-core, path: fennec-core }
      - uses: actions/checkout@v4
        with: { repository: Liso7150/fennec-economy, path: fennec-economy }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Test the launcher and the glue (66 checks)
        working-directory: fennec-cli
        run: cargo test --release
      - name: Build the CLI
        working-directory: fennec-cli
        run: cargo build --release
      - name: CLI smoke (help and version for every name)
        working-directory: fennec-cli
        run: |
          EXT=; [ "$RUNNER_OS" = "Windows" ] && EXT=.exe
          ./target/release/fennec$EXT --help
          ./target/release/fennec$EXT --version
          ./target/release/fennec-rs$EXT --help
        shell: bash
      - name: Package launcher
        shell: bash
        run: |
          mkdir -p dist
          python - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path("target/release/fennec.exe" if os.name == "nt" else "target/release/fennec")
          platform = f"{os.environ['RUNNER_OS'].lower()}-{os.environ['RUNNER_ARCH'].lower()}"
          suffix = ".exe" if os.name == "nt" else ""
          asset = pathlib.Path("dist") / f"fennec-cli-{platform}{suffix}"
          shutil.copyfile(source, asset)
          print(asset)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fennec-cli-${{ matrix.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fennec-cli-*
          path: dist
          merge-multiple: true
      - name: Publish checksums and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*
