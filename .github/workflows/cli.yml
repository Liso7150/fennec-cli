name: CLI (Rust)

# The CLI lives in fennec-cli; its core crates are path deps on fennec-core, so
# check out both repos side by side. Runs on a SAC-free runner.
on:
  push:
    paths: ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/cli.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: fennec-cli }
      - uses: actions/checkout@v4
        with: { repository: Liso7150/fennec-core, path: fennec-core }
      - uses: actions/checkout@v4
        with: { repository: Liso7150/fennec-economy, path: fennec-economy }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Test the launcher and the glue (66 checks)
        working-directory: fennec-cli
        run: cargo test --release
      - name: Build the CLI
        working-directory: fennec-cli
        run: cargo build --release
      - name: CLI smoke (help and version for every name)
        working-directory: fennec-cli
        run: |
          EXT=; [ "$RUNNER_OS" = "Windows" ] && EXT=.exe
          ./target/release/fennec$EXT --help
          ./target/release/fennec$EXT --version
          ./target/release/fennec-rs$EXT --help
        shell: bash
